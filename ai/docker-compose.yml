services:
  ai-layer:
    build:
      context: ./ai-layer
    env_file:
      - path: ./ai-layer/.env
        required: false
    volumes:
      # Read-only access to the host's Claude Code credentials, so the
      # CLAUDE_CODE_OAUTH_TOKEN auto-detect fallback (~/.claude/.credentials.json)
      # has something to read, the container's own $HOME has no such file.
      # ${USERPROFILE} is the fallback for native Windows shells (PowerShell,
      # cmd.exe), which don't set $HOME the way Linux/macOS/WSL/Git Bash do;
      # confirmed via `docker compose config` that Compose resolves this
      # nested default correctly and picks whichever one is actually set.
      - ${HOME:-${USERPROFILE}}/.claude:/root/.claude:ro
    ports:
      - "8000:8000"

  orchestrator:
    build:
      context: ./orchestrator
    env_file:
      - path: ./orchestrator/.env
        required: false
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
    depends_on:
      ai-layer:
        condition: service_started
    expose:
      - "8001"
  retrieval:
    build: ./retrieval
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
    expose:
      - "8010"
    # crawl4ai hardcodes --no-sandbox and --disable-dev-shm-usage into every
    # Chromium launch (confirmed in its browser_manager.py source), so the
    # classic Docker+Chromium /dev/shm crash is already mostly mitigated
    # before shm_size is even set, this is cheap extra insurance, not a fix
    # for a live problem. init reaps zombie Chromium/zygote processes
    # (Playwright's own Docker guidance). cap_drop/no-new-privileges are safe
    # since --no-sandbox means Chromium needs no elevated capabilities anyway,
    # confirmed by actually running the container with them.
    shm_size: "1gb"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      ai-layer:
        condition: service_started

  # Overrides the Dockerfile's static build with Vite's own dev server.
  chat-ui:
    build: ./chat-ui
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_API_PROXY_TARGET=http://ai-layer:8000
      - VITE_RETRIEVAL_PROXY_TARGET=http://retrieval:8010
      # See vite.config.ts's server.watch comment: without this, edits to a
      # bind-mounted file on the host can silently stop triggering HMR.
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./chat-ui:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      ai-layer:
        condition: service_started
      retrieval:
        condition: service_started
