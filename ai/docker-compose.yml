services:
  ai-layer:
    build:
      context: ./ai-layer
    env_file:
      - path: ./ai-layer/.env
        required: false
    volumes:
      # Read-only access to the host's Claude Code credentials, so the
      # CLAUDE_CODE_OAUTH_TOKEN auto-detect fallback (~/.claude/.credentials.json)
      # has something to read, the container's own $HOME has no such file.
      # ${USERPROFILE} is the fallback for native Windows shells (PowerShell,
      # cmd.exe), which don't set $HOME the way Linux/macOS/WSL/Git Bash do;
      # confirmed via `docker compose config` that Compose resolves this
      # nested default correctly and picks whichever one is actually set.
      - ${HOME:-${USERPROFILE}}/.claude:/root/.claude:ro
    ports:
      - "8000:8000"

  # Build context is ai/ (not ./orchestrator): the image assembles 2 sibling
  # Python packages (orchestrator/, clients/) into one container. Before
  # integration_runner became its own service (see below), this also
  # assembled integration_runner/ and serialization_agent/ into the same
  # image — orchestrator/Dockerfile shrinking to one sibling copy is a real
  # signal that split reduced coupling, not just relocated it.
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file:
      - path: ./orchestrator/.env
        required: false
    environment:
      # ai_layer_client.chat() is still called directly here (narration and
      # send_message()'s own tool-routing decision, see assistant.py), and
      # main.py's /providers proxies ai_layer_client.list_providers() too —
      # orchestrator is still the LLM-chat layer. It has no import on
      # clients/retrieval_client.py at all anymore, though: the
      # add_page_to_docs tool calls integration_runner's own POST
      # /docs/extend now (see tools/docs.py), not retrieval directly, so
      # RETRIEVAL_URL isn't needed here.
      - AI_LAYER_URL=http://ai-layer:8000
      - INTEGRATION_RUNNER_URL=http://integration-runner:8050
    depends_on:
      ai-layer:
        condition: service_healthy
      integration-runner:
        condition: service_healthy
    expose:
      - "8001"

  # Own container, own real REST API — the pipeline state machine, run
  # history, and stage agents, promoted out of orchestrator's own container
  # so the two communicate only over HTTP (see integration_runner/main.py
  # and clients/integration_runner_client.py), not by orchestrator importing
  # this package's Python internals directly the way it used to. Build
  # context ai/ (not ./integration_runner): reaches the sibling clients/
  # package, the HTTP clients for every real capability its stages call out
  # for.
  integration-runner:
    build:
      context: .
      dockerfile: integration_runner/Dockerfile
    env_file:
      - path: ./integration_runner/.env
        required: false
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
      - RETRIEVAL_URL=http://retrieval:8010
      - SERIALIZATION_AGENT_URL=http://serialization-agent:8060
      - PSM_AGENT_URL=http://psm-agent:8040
    depends_on:
      ai-layer:
        condition: service_healthy
      retrieval:
        condition: service_healthy
      serialization-agent:
        condition: service_healthy
      psm-agent:
        condition: service_healthy
    expose:
      - "8050"

  # Own container: a concrete, stated future need, not speculative — see
  # pim_agent/__init__.py's own comment for the real cited source
  # (MDDOAI_Agentic_Architecture.drawio's Phase 1 plan) and what it does vs.
  # doesn't establish. Today's real capability (ground()/PIM_CONCEPTS) is
  # still plain Python — see pim_agent/Dockerfile's own comment.
  pim-agent:
    build: ./pim_agent
    expose:
      - "8030"

  # Own container: the real psm stage's whole capability, POST /psm (routes
  # between generating a new metamodel and checking an existing one for
  # drift, see psm_agent/psm_flow.py). Calls pim-agent for grounding and
  # validator-agent to check a freshly generated .ecore loads in EMF before
  # returning it. Needs read access to meta_models/ (the real .ecore PSM
  # metamodels, outside ai/ entirely) — mounted read-only rather than copied
  # into the image, so a metamodel change doesn't need a rebuild.
  psm-agent:
    build:
      context: .
      dockerfile: psm_agent/Dockerfile
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
      - META_MODELS_DIR=/meta_models
      - PIM_AGENT_URL=http://pim-agent:8030
      - VALIDATOR_AGENT_URL=http://validator-agent:8020
    volumes:
      - ../meta_models:/meta_models:ro
    depends_on:
      ai-layer:
        condition: service_healthy
      pim-agent:
        condition: service_healthy
      validator-agent:
        condition: service_healthy
    expose:
      - "8040"

  # Own container, same reasoning as pim-agent/psm-agent: a real pipeline
  # capability (the docs stage's raw output -> a PIM-concept-labeled
  # markdown artifact) gets independent deployability, not bundled into
  # whichever process happens to call it. Calls ai-layer directly (its own
  # extraction LLM call) and pim-agent (concept grounding).
  serialization-agent:
    build:
      context: .
      dockerfile: serialization_agent/Dockerfile
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
      - PIM_AGENT_URL=http://pim-agent:8030
    depends_on:
      ai-layer:
        condition: service_healthy
      pim-agent:
        condition: service_healthy
    expose:
      - "8060"

  # Build context ai/ (not ./retrieval): reaches the sibling clients/
  # package (retrieval.py's LLM calls go through clients/ai_layer_client.py's
  # async achat() now).
  retrieval:
    build:
      context: .
      dockerfile: retrieval/Dockerfile
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
    expose:
      - "8010"
    # crawl4ai hardcodes --no-sandbox and --disable-dev-shm-usage into every
    # Chromium launch (confirmed in its browser_manager.py source), so the
    # classic Docker+Chromium /dev/shm crash is already mostly mitigated
    # before shm_size is even set, this is cheap extra insurance, not a fix
    # for a live problem. init reaps zombie Chromium/zygote processes
    # (Playwright's own Docker guidance). cap_drop/no-new-privileges are safe
    # since --no-sandbox means Chromium needs no elevated capabilities anyway,
    # confirmed by actually running the container with them.
    shm_size: "1gb"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      ai-layer:
        condition: service_healthy

  # Overrides the Dockerfile's static build with Vite's own dev server.
  # Build context is ai/, not ai/ui-host/: package.json depends on
  # design-system and orchestrator-types via local "file:../..." paths, and
  # Docker can't COPY from outside its build context (see ui-host/Dockerfile's
  # own comment). Both get their own bind mount below for the same reason
  # ui-host itself does — so live edits to their source reach the running dev
  # server without an image rebuild, matching the symlink's real target path
  # (a sibling of /app) that npm ci baked into the image at build time.
  ui-host:
    build:
      context: .
      dockerfile: ui-host/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_ORCHESTRATOR_PROXY_TARGET=http://orchestrator:8001
      # See vite.config.ts's server.watch comment: without this, edits to a
      # bind-mounted file on the host can silently stop triggering HMR.
      - CHOKIDAR_USEPOLLING=true
      # Browser-resolvable URLs for each Module Federation remote below —
      # see vite.config.ts's own remote() helper for why these have to be
      # real localhost:xxxx addresses rather than Docker service names
      # (unlike VITE_ORCHESTRATOR_PROXY_TARGET above, the browser itself
      # fetches these directly, not this container's own dev server).
      - VITE_REMOTE_CHAT_URL=http://localhost:5174
      - VITE_REMOTE_STEPPER_URL=http://localhost:5175
      - VITE_REMOTE_STAGE_DOCS_URL=http://localhost:5176
      - VITE_REMOTE_STAGE_SERIALIZATION_URL=http://localhost:5177
      - VITE_REMOTE_STAGE_PIM_URL=http://localhost:5178
      - VITE_REMOTE_STAGE_PSM_URL=http://localhost:5179
      - VITE_REMOTE_STAGE_ATL_URL=http://localhost:5180
      - VITE_REMOTE_STAGE_ACCELEO_URL=http://localhost:5181
      - VITE_REMOTE_STAGE_GENERATION_URL=http://localhost:5182
    volumes:
      - ./ui-host:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5173:5173"
    depends_on:
      orchestrator:
        condition: service_healthy

  # Every ui-remote-* service below follows the same shape: a Module
  # Federation remote, own container, own port, exposing one piece of the
  # integration screen for ui-host to load as a federated import (see
  # ui-host/src/features/integration/stages/registry.ts and
  # IntegrationScreen.tsx for where each one is actually consumed). No
  # depends_on chain to ui-host or each other: unlike the backend services
  # above, nothing here calls another service at container-start time, only
  # the browser fetches a remote's remoteEntry.js, later, and can retry
  # independently — so there's no health-check ordering to get right, a
  # real simplification versus the backend chain's own depends_on graph.
  # Each gets the sibling design-system bind mount for the same reason
  # ui-host does (see ui-host/Dockerfile's own comment).
  ui-remote-chat:
    build:
      context: .
      dockerfile: ui-remote-chat/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./ui-remote-chat:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5174:5174"

  ui-remote-stepper:
    build:
      context: .
      dockerfile: ui-remote-stepper/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./ui-remote-stepper:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5175:5175"

  ui-remote-stage-docs:
    build:
      context: .
      dockerfile: ui-remote-stage-docs/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./ui-remote-stage-docs:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5176:5176"

  ui-remote-stage-serialization:
    build:
      context: .
      dockerfile: ui-remote-stage-serialization/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./ui-remote-stage-serialization:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5177:5177"

  ui-remote-stage-pim:
    build:
      context: .
      dockerfile: ui-remote-stage-pim/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./ui-remote-stage-pim:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5178:5178"

  ui-remote-stage-psm:
    build:
      context: .
      dockerfile: ui-remote-stage-psm/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./ui-remote-stage-psm:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5179:5179"

  ui-remote-stage-atl:
    build:
      context: .
      dockerfile: ui-remote-stage-atl/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./ui-remote-stage-atl:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5180:5180"

  ui-remote-stage-acceleo:
    build:
      context: .
      dockerfile: ui-remote-stage-acceleo/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./ui-remote-stage-acceleo:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5181:5181"

  ui-remote-stage-generation:
    build:
      context: .
      dockerfile: ui-remote-stage-generation/Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./ui-remote-stage-generation:/app
      - /app/node_modules
      - ./design-system:/design-system
      - ./orchestrator-types:/orchestrator-types
    ports:
      - "5182:5182"

  # One-shot: builds main/'s Gradle distribution into the main-build-output
  # volume, so validator-agent doesn't need its own Gradle toolchain.
  # main-gradle-cache persists so repeat builds are fast.
  gradle-builder:
    image: gradle:8.14.3-jdk21-alpine
    working_dir: /workspace
    volumes:
      - ../main:/workspace
      - main-gradle-cache:/root/.gradle
      - main-build-output:/workspace/build
    # Piped through tr + sh, not run directly: Windows checkouts leave gradlew
    # with CRLF endings, which breaks it here. Piping avoids writing any file.
    # No `clean`: build/ is a volume mount point, Gradle can't rmdir it (and doesn't
    # need to — this volume is dedicated to this one build, nothing else writes to it).
    command: ["sh", "-c", "tr -d '\r' < ./gradlew | sh -s -- --no-daemon build -x test installDist"]

  # Wraps main/'s headless model/transformation validators as an HTTP service:
  # .ecore (issue #313), .atl (issue #314), and .mtl/Acceleo (issue #315).
  # Named validator-agent, not ecore-validator: a future validator type would
  # add another sibling /validate/<type> route to this same service.
  validator-agent:
    build:
      context: ./validator_agent
    env_file:
      - path: ./validator_agent/.env
        required: false
    volumes:
      - main-build-output:/main-build:ro
      # Writable: EcoreValidator's codegen path persists generated
      # .genmodel/src-gen/classes-out output here instead of deleting it (see
      # main/.../ecore/EcoreValidator.java's OUTPUT_ROOT). Separate from the
      # read-only main-build-output mount above (unrelated build artifacts) -
      # a distinct volume, not a subpath of it, so a bad write here can never
      # touch the real build output. No automatic expiry/cleanup of old
      # validation runs yet - a known, documented limitation, not attempted
      # here since nobody's asked for a retention policy.
      - validator-generated-output:/validator-output
    environment:
      - LOG_LEVEL=INFO
      - VALIDATOR_TIMEOUT_SECONDS=60
      - VALIDATOR_LIB_DIR=/main-build/install/com.mddoai/lib
      - VALIDATOR_OUTPUT_DIR=/validator-output
    depends_on:
      gradle-builder:
        condition: service_completed_successfully
    expose:
      - "8020"

volumes:
  main-gradle-cache:
  main-build-output:
  validator-generated-output:
