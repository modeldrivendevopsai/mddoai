services:
  ai-layer:
    build:
      context: ./ai-layer
    env_file:
      - path: ./ai-layer/.env
        required: false
    volumes:
      # Read-only access to the host's Claude Code credentials, so the
      # CLAUDE_CODE_OAUTH_TOKEN auto-detect fallback (~/.claude/.credentials.json)
      # has something to read, the container's own $HOME has no such file.
      # ${USERPROFILE} is the fallback for native Windows shells (PowerShell,
      # cmd.exe), which don't set $HOME the way Linux/macOS/WSL/Git Bash do;
      # confirmed via `docker compose config` that Compose resolves this
      # nested default correctly and picks whichever one is actually set.
      - ${HOME:-${USERPROFILE}}/.claude:/root/.claude:ro
    ports:
      # From ai/.env.
      - "${AI_LAYER_PORT:?set it in ai/.env, see ai/.env.example}:8000"

  # Build context is ai/ (not ./orchestrator): the image assembles 2 sibling
  # Python packages (orchestrator/, clients/) into one container. Before
  # integration_runner became its own service (see below), this also
  # assembled integration_runner/ and serialization_agent/ into the same
  # image — orchestrator/Dockerfile shrinking to one sibling copy is a real
  # signal that split reduced coupling, not just relocated it.
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file:
      - path: ./orchestrator/.env
        required: false
    environment:
      # ai_layer_client.chat() is still called directly here (narration and
      # accept_message()'s own tool-routing decision, see assistant.py), and
      # main.py's /providers proxies ai_layer_client.list_providers() too —
      # orchestrator is still the LLM-chat layer. It has no import on
      # clients/retrieval_client.py at all anymore, though: the
      # add_page_to_docs tool calls integration_runner's own POST
      # /docs/extend now (see tools/docs.py), not retrieval directly, so
      # RETRIEVAL_URL isn't needed here.
      - AI_LAYER_URL=http://ai-layer:8000
      - INTEGRATION_RUNNER_URL=http://integration-runner:8050
    depends_on:
      ai-layer:
        condition: service_healthy
      integration-runner:
        condition: service_healthy
    expose:
      - "8001"

  # Own container, own real REST API — the pipeline state machine, run
  # history, and stage agents, promoted out of orchestrator's own container
  # so the two communicate only over HTTP (see integration_runner/main.py
  # and clients/integration_runner_client.py), not by orchestrator importing
  # this package's Python internals directly the way it used to. Build
  # context ai/ (not ./integration_runner): reaches the sibling clients/
  # package, the HTTP clients for every real capability its stages call out
  # for.
  integration-runner:
    build:
      context: .
      dockerfile: integration_runner/Dockerfile
    env_file:
      - path: ./integration_runner/.env
        required: false
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
      - RETRIEVAL_URL=http://retrieval:8010
      - SERIALIZATION_AGENT_URL=http://serialization-agent:8060
      - ATL_AGENT_URL=http://atl-agent:8070
      - ACCELEO_AGENT_URL=http://acceleo-agent:8080
      - PSM_AGENT_URL=http://psm-agent:8040
      - VALIDATOR_AGENT_URL=http://validator-agent:8020
      - EXECUTION_AGENT_URL=http://execution-agent:8090
      - PIM_METAMODEL_PATH=/pim_metamodel.ecore
      - PIM_SAMPLE_INSTANCE_PATH=/pim_sample_instance.pimmm
    volumes:
      # The project's own real, git-committed PIM metamodel - a single real
      # file, not a whole meta_models/ tree (narrower than psm-agent's own
      # META_MODELS_DIR mount below, matching atl-agent's/acceleo-agent's own
      # single-file REFERENCE_EXAMPLE_PATH convention instead), since this is
      # the one real file stages/pim/agent.py ever needs. See
      # ai/CLAUDE.md's folder-boundaries section for why this read is
      # licensed (real MDE *data*, not Java/Eclipse *code*).
      - ../meta_models/com.mddoai.metamodel.pim/model/pimMM.ecore:/pim_metamodel.ecore:ro
      # A real, rich PIM model instance (11 jobs, exercising all of MDDOAI's
      # own PIM concepts), the one real file stages/generation/agent.py
      # needs as its real input to the real ATL/Acceleo execution it runs
      # via execution-agent (see the fourth exception in ai/CLAUDE.md's
      # folder-boundaries section).
      - ../main/src/test/resources/testCases/execution/gitlab/input.pimmm:/pim_sample_instance.pimmm:ro
      # Mounted at the exact path integration_runner/stages/_validation.py's
      # own RUNS_DIR resolves to inside this container (this Dockerfile's own
      # final WORKDIR is /app/integration_runner, not /app - RUNS_DIR is
      # relative to that, not to the repo-relative path it looks like in the
      # Python source). Shared with validator-agent's own mount of the same
      # volume below: this is where every stage's persist_attempt() writes
      # (the real artifact + result.json + manifest.json), and where
      # validator-agent's own compiled output (Ecore's codegen classes, ATL's
      # .asm, Acceleo's .emtl - all real, reusable pipeline artifacts per
      # this project's stated direction, not just validation debris) lands
      # too. For atl/acceleo/psm, that compiled output nests one level inside
      # the exact attempt directory persist_attempt() writes its own artifact
      # and result.json into (runs/<run_id>/<stage>/attempt_N/<type>-validate-
      # <uuid>/), because those stages reserve their own attempt directory
      # before validator-agent ever gets called and forward both their own
      # stage name and that attempt's name as the stage/attempt fields (see
      # stages/atl/agent.py, stages/acceleo/agent.py, stages/psm/agent.py,
      # and validator_runner.py's own _scoped_output_env()) - for psm
      # specifically, integration_runner reserves the attempt directory and
      # forwards those two fields over HTTP to psm_agent, which just carries
      # them through its own real generate-validate-retry loop unchanged;
      # pim only ever validates reflectively today, so it never scopes by
      # run_id, stage, or attempt at all. Get this path wrong and the two
      # services silently write to different, unrelated directories -
      # verify it against RUNS_DIR itself before changing either side.
      - pipeline-runs:/app/integration_runner/runs
    depends_on:
      ai-layer:
        condition: service_healthy
      retrieval:
        condition: service_healthy
      serialization-agent:
        condition: service_healthy
      psm-agent:
        condition: service_healthy
      atl-agent:
        condition: service_healthy
      acceleo-agent:
        condition: service_healthy
      validator-agent:
        condition: service_healthy
      execution-agent:
        condition: service_healthy
    expose:
      - "8050"

  # Own container: a concrete, stated future need, not speculative — see
  # pim_agent/__init__.py's own comment for the real cited source
  # (MDDOAI_Agentic_Architecture.drawio's Phase 1 plan) and what it does vs.
  # doesn't establish. Today's real capability (ground()/PIM_CONCEPTS) is
  # still plain Python — see pim_agent/Dockerfile's own comment.
  pim-agent:
    build: ./pim_agent
    expose:
      - "8030"

  # Own container: the real psm stage's whole capability, POST /psm (routes
  # between generating a new metamodel and checking an existing one for
  # drift, see psm_agent/psm_flow.py). Calls pim-agent for grounding and
  # validator-agent to check a freshly generated .ecore loads in EMF before
  # returning it. Needs read access to meta_models/ (the real .ecore PSM
  # metamodels, outside ai/ entirely) — mounted read-only rather than copied
  # into the image, so a metamodel change doesn't need a rebuild.
  psm-agent:
    build:
      context: .
      dockerfile: psm_agent/Dockerfile
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
      - META_MODELS_DIR=/meta_models
      - PIM_AGENT_URL=http://pim-agent:8030
      - VALIDATOR_AGENT_URL=http://validator-agent:8020
    volumes:
      - ../meta_models:/meta_models:ro
      # Real, editable, UI-built prompt configs (generation_toolkit.prompt_config)
      # - the real generation/comparison JSON files this service's own
      # prompt_paths.PROMPT_CONFIG_DIR resolves to (relative to this
      # Dockerfile's own final WORKDIR, /app/psm_agent, not /app). Read-write
      # and scoped to just this directory, not the whole psm_agent/ source
      # tree: a Save through the running dev container needs to land on the
      # host's real git checkout (these files are committed, not
      # gitignored).
      - ./psm_agent/prompts:/app/psm_agent/prompts
      # Real human-uploaded "file" attachments (routes/uploads.py) - a
      # separate, writable directory from both the read-only meta_models
      # mount above and the git-committed prompts/ one: an upload is
      # per-deployment content a human added, not a real pre-existing repo
      # file and not curated starting prompt material (see the root
      # .gitignore's own matching entry for this same directory).
      - ./psm_agent/attachments:/app/psm_agent/attachments
    depends_on:
      ai-layer:
        condition: service_healthy
      pim-agent:
        condition: service_healthy
      validator-agent:
        condition: service_healthy
    expose:
      - "8040"

  # Own container, same reasoning as psm-agent: the real atl stage's whole
  # capability, POST /generate (generate a new PIM->target-platform ATL
  # transformation, validate it against validator-agent, retry on failure -
  # see atl_agent/generation.py). No pim-agent dependency: unlike psm, atl
  # generation needs no concept-grounding call, just the pim/psm ecores
  # already in the pipeline context. Its master-example ATL file
  # (atl_agent/prompt_paths.py's own REFERENCE_EXAMPLE_PATH) is a real file
  # this service owns directly under its own reference_example/, ported
  # from this project's own validated ai-research experiments - no Docker
  # bind mount needed for it, unlike psm-agent's own whole-directory
  # meta_models/ mount of real MDE-engine data this service doesn't own.
  atl-agent:
    build:
      context: .
      dockerfile: atl_agent/Dockerfile
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
      - VALIDATOR_AGENT_URL=http://validator-agent:8020
    volumes:
      # Same reasoning as psm-agent's own prompts/ and attachments/ mounts:
      # git-committed prompt config read-write so a Save through the running
      # dev container lands on the host's real git checkout, uploads kept in
      # their own separate writable directory.
      - ./atl_agent/prompts:/app/atl_agent/prompts
      - ./atl_agent/attachments:/app/atl_agent/attachments
    depends_on:
      ai-layer:
        condition: service_healthy
      validator-agent:
        condition: service_healthy
    expose:
      - "8070"

  # Own container, same reasoning as atl-agent: the real acceleo stage's
  # whole capability, POST /generate (generate a new Acceleo code-generation
  # template from the target platform's own PSM metamodel and its labeled
  # documentation, validate against validator-agent, retry on failure - see
  # acceleo_agent/generation.py). No PIM input at all, no pim-agent
  # dependency. Same reasoning as atl-agent for its own master-example
  # Acceleo template: a real file this service owns directly, no bind
  # mount needed.
  acceleo-agent:
    build:
      context: .
      dockerfile: acceleo_agent/Dockerfile
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
      - VALIDATOR_AGENT_URL=http://validator-agent:8020
    volumes:
      - ./acceleo_agent/prompts:/app/acceleo_agent/prompts
      - ./acceleo_agent/attachments:/app/acceleo_agent/attachments
    depends_on:
      ai-layer:
        condition: service_healthy
      validator-agent:
        condition: service_healthy
    expose:
      - "8080"

  # Own container, same reasoning as pim-agent/psm-agent: a real pipeline
  # capability (the docs stage's raw output -> a PIM-concept-labeled
  # markdown artifact) gets independent deployability, not bundled into
  # whichever process happens to call it. Calls ai-layer directly (its own
  # extraction LLM call) and pim-agent (concept grounding).
  serialization-agent:
    build:
      context: .
      dockerfile: serialization_agent/Dockerfile
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
      - PIM_AGENT_URL=http://pim-agent:8030
    depends_on:
      ai-layer:
        condition: service_healthy
      pim-agent:
        condition: service_healthy
    expose:
      - "8060"

  # Build context ai/ (not ./retrieval): reaches the sibling clients/
  # package (retrieval.py's LLM calls go through clients/ai_layer_client.py's
  # async achat() now).
  retrieval:
    build:
      context: .
      dockerfile: retrieval/Dockerfile
    environment:
      - AI_LAYER_URL=http://ai-layer:8000
    expose:
      - "8010"
    # crawl4ai hardcodes --no-sandbox and --disable-dev-shm-usage into every
    # Chromium launch (confirmed in its browser_manager.py source), so the
    # classic Docker+Chromium /dev/shm crash is already mostly mitigated
    # before shm_size is even set, this is cheap extra insurance, not a fix
    # for a live problem. init reaps zombie Chromium/zygote processes
    # (Playwright's own Docker guidance). cap_drop/no-new-privileges are safe
    # since --no-sandbox means Chromium needs no elevated capabilities anyway,
    # confirmed by actually running the container with them.
    shm_size: "1gb"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      ai-layer:
        condition: service_healthy

  # The UI is built into static files, served by nginx. Build context is ai/,
  # not ai/ui-host/: package.json depends on design-system and
  # orchestrator-types via local "file:../..." paths, and Docker can't COPY
  # from outside its build context (see ui-host/Dockerfile's own comment). A
  # change to the UI's code takes `docker compose up -d --build` of the
  # service it is in.
  ui-host:
    build:
      context: .
      dockerfile: ui-host/Dockerfile
      args:
        # Where the browser loads each remote below from: this service's own
        # proxy, which forwards /remotes/<name>/ to ui-remote-<name>. Built
        # into the app, so changing one means rebuilding this image.
        - VITE_REMOTE_CHAT_URL=/remotes/chat
        - VITE_REMOTE_STEPPER_URL=/remotes/stepper
        - VITE_REMOTE_STAGE_DOCS_URL=/remotes/stage-docs
        - VITE_REMOTE_STAGE_SERIALIZATION_URL=/remotes/stage-serialization
        - VITE_REMOTE_STAGE_PIM_URL=/remotes/stage-pim
        - VITE_REMOTE_STAGE_PSM_URL=/remotes/stage-psm
        - VITE_REMOTE_STAGE_ATL_URL=/remotes/stage-atl
        - VITE_REMOTE_STAGE_ACCELEO_URL=/remotes/stage-acceleo
        - VITE_REMOTE_STAGE_GENERATION_URL=/remotes/stage-generation
    environment:
      # Filled into the proxy's configuration when the container starts.
      # The host names the app may be opened under. Any other Host header is
      # refused, so a page using DNS rebinding cannot reach the APIs. The
      # names come from UI_ALLOWED_HOSTS in ai/.env.
      - UI_ALLOWED_HOSTS=${UI_ALLOWED_HOSTS:?set it in ai/.env, see ai/.env.example}
      # From ai/.env.
      - UI_MAX_BODY_SIZE=${UI_MAX_BODY_SIZE:?set it in ai/.env, see ai/.env.example}
      - UI_PROXY_READ_TIMEOUT=${UI_PROXY_READ_TIMEOUT:?set it in ai/.env, see ai/.env.example}
      - ORCHESTRATOR_UPSTREAM=orchestrator:8001
    ports:
      # The one port the browser uses: the app, every remote and the
      # orchestrator's API. This machine only: nothing here has a login.
      # UI_PORT is from ai/.env.
      - "127.0.0.1:${UI_PORT:?set it in ai/.env, see ai/.env.example}:80"

  # Every ui-remote-* service below follows the same shape: a Module
  # Federation remote, its own image and container, exposing one piece of the
  # integration screen for ui-host to load as a federated import (see
  # ui-host/src/features/integration/stages/registry.ts and
  # IntegrationScreen.tsx for where each one is actually consumed). Each is
  # built into static files served by nginx, reached only through ui-host's
  # proxy under /remotes/<name>/, so it publishes no port. PUBLIC_PATH must
  # match that path. A remote can be rebuilt and restarted on its own; the
  # page picks it up on its next load.
  ui-remote-chat:
    build:
      context: .
      dockerfile: ui-remote-chat/Dockerfile
      args:
        - PUBLIC_PATH=/remotes/chat/

  ui-remote-stepper:
    build:
      context: .
      dockerfile: ui-remote-stepper/Dockerfile
      args:
        - PUBLIC_PATH=/remotes/stepper/

  ui-remote-stage-docs:
    build:
      context: .
      dockerfile: ui-remote-stage-docs/Dockerfile
      args:
        - PUBLIC_PATH=/remotes/stage-docs/

  ui-remote-stage-serialization:
    build:
      context: .
      dockerfile: ui-remote-stage-serialization/Dockerfile
      args:
        - PUBLIC_PATH=/remotes/stage-serialization/

  ui-remote-stage-pim:
    build:
      context: .
      dockerfile: ui-remote-stage-pim/Dockerfile
      args:
        - PUBLIC_PATH=/remotes/stage-pim/

  ui-remote-stage-psm:
    build:
      context: .
      dockerfile: ui-remote-stage-psm/Dockerfile
      args:
        - PUBLIC_PATH=/remotes/stage-psm/

  ui-remote-stage-atl:
    build:
      context: .
      dockerfile: ui-remote-stage-atl/Dockerfile
      args:
        - PUBLIC_PATH=/remotes/stage-atl/

  ui-remote-stage-acceleo:
    build:
      context: .
      dockerfile: ui-remote-stage-acceleo/Dockerfile
      args:
        - PUBLIC_PATH=/remotes/stage-acceleo/

  ui-remote-stage-generation:
    build:
      context: .
      dockerfile: ui-remote-stage-generation/Dockerfile
      args:
        - PUBLIC_PATH=/remotes/stage-generation/

  # One-shot: builds main/'s Gradle distribution into the main-build-output
  # volume, so validator-agent doesn't need its own Gradle toolchain.
  # main-gradle-cache persists so repeat builds are fast.
  gradle-builder:
    image: gradle:8.14.3-jdk21-alpine
    working_dir: /workspace
    volumes:
      - ../main:/workspace
      - main-gradle-cache:/root/.gradle
      - main-build-output:/workspace/build
    # Piped through tr + sh, not run directly: Windows checkouts leave gradlew
    # with CRLF endings, which breaks it here. Piping avoids writing any file.
    # No `clean`: build/ is a volume mount point, Gradle can't rmdir it (and doesn't
    # need to — this volume is dedicated to this one build, nothing else writes to it).
    command: ["sh", "-c", "tr -d '\r' < ./gradlew | sh -s -- --no-daemon build -x test installDist"]

  # Wraps main/'s headless model/transformation validators as an HTTP service:
  # .ecore (issue #313), .atl (issue #314), and .mtl/Acceleo (issue #315).
  # Named validator-agent, not ecore-validator: a future validator type would
  # add another sibling /validate/<type> route to this same service.
  validator-agent:
    build:
      context: ./validator_agent
    env_file:
      - path: ./validator_agent/.env
        required: false
    volumes:
      - main-build-output:/main-build:ro
      # Writable, shared with integration-runner's own runs/ mount above (the
      # same named volume, mounted at each service's own real path - see that
      # mount's own comment for why the paths differ but the storage doesn't).
      # EcoreValidator's codegen path, AtlValidator, and AcceleoValidator all
      # persist their real compiled output here instead of deleting it (see
      # each one's own OUTPUT_ROOT constant), scoped under a per-run_id
      # subfolder when the caller has one, and two levels deeper still under
      # the caller's own stage/attempt subfolders when it has reserved one
      # (validator_runner.py's own _scoped_output_env(), given run_id, stage,
      # and attempt together by atl_stage/acceleo_stage's own direct calls
      # here, or by psm_agent's own generation code, using the same two
      # values stages/psm/agent.py reserved and forwarded to it over HTTP -
      # see stages/_validation.py's own reserve_attempt_dir()). That nests the
      # compiled artifact inside the exact attempt_N/ directory
      # integration_runner's own persist_attempt() writes its artifact and
      # result.json into (runs/<run_id>/<stage>/attempt_N/<type>-validate-
      # <uuid>/), not beside it. Separate from the read-only main-build-output mount above
      # (unrelated build artifacts) - a distinct volume, not a subpath of it,
      # so a bad write here can never touch the real build output. No
      # automatic expiry/cleanup of old validation runs yet - a known,
      # documented limitation, not attempted here since nobody's asked for a
      # retention policy.
      - pipeline-runs:/runs
      # The same real, rich PIM model instance integration-runner's own
      # generation-stage mount above already uses (see its own comment) -
      # AtlValidator's/AcceleoValidator's own real execution smoke test reads
      # it too now (given a real target metamodel), so a generated ATL/
      # Acceleo pair that compiles but crashes at runtime (e.g. instantiating
      # an abstract classifier) gets caught during atl_stage's/acceleo_stage's
      # own retry loop, not only later at the pipeline's final execution
      # stage with no retries left. Extends the existing "third exception" in
      # ai/CLAUDE.md's folder-boundaries section to this service too, for the
      # identical reason (a real, read-only MDE data file, not code).
      - ../main/src/test/resources/testCases/execution/gitlab/input.pimmm:/pim_sample_instance.pimmm:ro
    environment:
      - VALIDATOR_LIB_DIR=/main-build/install/com.mddoai/lib
      - VALIDATOR_OUTPUT_DIR=/runs
      - ATL_SMOKE_TEST_PIM_INSTANCE_PATH=/pim_sample_instance.pimmm
    depends_on:
      gradle-builder:
        condition: service_completed_successfully
    expose:
      - "8020"

  # Wraps main/'s new real Atl/AcceleoExecutor as an HTTP service: actually
  # RUNS a real .atl/.mtl transformation against a real model instance,
  # instead of only compiling it to check for errors (validator-agent's own,
  # separate concern). A genuinely separate service from validator-agent, not
  # new /execute/* routes there - see execution_agent/README.md's own "Why a
  # separate service" section for the real reasoning (validator-agent's
  # documented scope and ai/CLAUDE.md's own reach-into-main/ exception are
  # both scoped specifically to *ValidatorCli classes under mddoai.validation,
  # not mddoai.execution, and the two services' real request/response
  # contracts genuinely differ, not just the HTTP verb).
  execution-agent:
    build:
      context: ./execution_agent
    env_file:
      - path: ./execution_agent/.env
        required: false
    volumes:
      # Read-only, same shared build-output volume validator-agent already
      # mounts (see its own comment) - no second Gradle build needed. No
      # pipeline-runs mount, unlike validator-agent: the real output here
      # (a transformed model instance, or generated CI/CD text) is exactly
      # what a caller needs back, not a debug-only compiled artifact worth
      # persisting for its own sake, so it's returned inline over HTTP
      # instead (see execution_agent/README.md's own "How a request flows").
      - main-build-output:/main-build:ro
    environment:
      - EXECUTION_LIB_DIR=/main-build/install/com.mddoai/lib
    depends_on:
      gradle-builder:
        condition: service_completed_successfully
    expose:
      - "8090"

volumes:
  main-gradle-cache:
  main-build-output:
  pipeline-runs:
