[pytest]
testpaths = tests
# . resolves this package's own bare imports (main, pipeline, runs,
# stages); .. resolves the cross-package import to the sibling ai/clients/
# package; tests resolves tests/helpers.py
# and tests/conftest.py from test files nested in tests/ subfolders
# (tests/stages/, ...), which pytest's own per-file rootless import
# resolution wouldn't otherwise reach — without this, a test file two
# folders deep gets tests/<subfolder>/ inserted into sys.path instead of
# tests/ itself, so `from helpers import ...` would fail to find it.
pythonpath = . .. tests
