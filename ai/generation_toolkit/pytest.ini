[pytest]
testpaths = tests
# .. (ai/) makes this package importable by its real qualified name,
# generation_toolkit.<module> - not a bare `.` entry: generation_agent.py's
# own `from .prompt_builder import ...` is a real relative import, so it must
# always be loaded as part of the generation_toolkit package, the same way a
# real caller (e.g. psm_agent) imports it, never as a loose top-level module.
pythonpath = ..
