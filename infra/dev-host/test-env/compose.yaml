# The way in from the internet: Cloudflare -> cloudflared -> oauth2-proxy -> ui-host.
# cloudflared connects out, so no port opens on the VM.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: github
      # Never empty: an empty list would let any GitHub account in.
      OAUTH2_PROXY_GITHUB_USERS: ${GITHUB_USERS:?set GITHUB_USERS in the Test environment's .env}
      # Any address: the user list decides who gets in.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID:?}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:?}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?}
      OAUTH2_PROXY_REDIRECT_URL: https://${TEST_HOSTNAME:?}/oauth2/callback
      OAUTH2_PROXY_COOKIE_EXPIRE: ${OAUTH2_COOKIE_EXPIRE:?}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://ui-host:80/
      # Same wait as ui-host's own proxy.
      OAUTH2_PROXY_UPSTREAM_TIMEOUT: ${UI_PROXY_READ_TIMEOUT:?}
    networks: [default, gateway]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    # Shares a network with oauth2-proxy only, not with the stack.
    networks: [gateway]

networks:
  gateway: {}
