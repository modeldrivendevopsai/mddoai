# The Test environment's way in from the internet, added to the test stack
# through COMPOSE_FILE in .env:
#
#   browser -> Cloudflare -> cloudflared -> oauth2-proxy -> ui-host
#
# cloudflared connects out to Cloudflare, so no port opens on the VM.
# oauth2-proxy lets in only the GitHub users listed in GITHUB_USERS.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: github
      # Never empty: an empty list would let any GitHub account in.
      OAUTH2_PROXY_GITHUB_USERS: ${GITHUB_USERS:?set GITHUB_USERS in the Test environment's .env}
      # Any address: the user list decides who gets in.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID:?}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:?}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:?}
      OAUTH2_PROXY_REDIRECT_URL: https://${TEST_HOSTNAME:?}/oauth2/callback
      # The list is checked at login, so this is how long someone removed
      # from it keeps access (the default is a week).
      OAUTH2_PROXY_COOKIE_EXPIRE: 24h
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://ui-host:80/
      # The default, 30s, is shorter than the UI's slowest requests. This
      # matches ui-host's own proxy timeout (UI_PROXY_READ_TIMEOUT).
      OAUTH2_PROXY_UPSTREAM_TIMEOUT: 120s
    networks: [default, gateway]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    # Shares a network with oauth2-proxy only, not with the stack.
    networks: [gateway]

networks:
  gateway: {}
