---
version: 2
plan:
  project-key: CHATBOT_APP
  key: CHATBOT_APP
  name: chatbot-app

image: docker:24.0.5

variables:
  IMAGE_NAME: ${bamboo.CI_REGISTRY_IMAGE}/framework-chatbot-image
  IMAGE_TAG: ${bamboo.IMAGE_NAME}:${bamboo.IMAGE_VERSION}-${bamboo.CI_COMMIT_REF_SLUG}

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - build
        - unitTest
        - healthCheck
        - push

build:
  key: BUILD
  image: docker:24.0.5
  tasks:
    - script:
        interpreter: SHELL
        scripts:
          - docker build -t ${bamboo.IMAGE_TAG} .

unitTest:
  key: UNITTEST
  image: python:3.11
  tasks:
    - script:
        interpreter: SHELL
        scripts:
          - python3 test/run_unit_tests.py
  requirements:
    - os.linux

healthCheck:
  key: HEALTHCHECK
  image: curlimages/curl:latest
  tasks:
    - script:
        interpreter: SHELL
        scripts:
          - ./scripts/health_check.sh
  requirements:
    - os.linux

push:
  key: PUSH
  image: docker:24.0.5
  tasks:
    - script:
        interpreter: SHELL
        scripts:
          - docker login -u ${bamboo.CI_REGISTRY_USER} -p ${bamboo.CI_JOB_TOKEN} ${bamboo.CI_REGISTRY}
          - docker push ${bamboo.IMAGE_TAG}
