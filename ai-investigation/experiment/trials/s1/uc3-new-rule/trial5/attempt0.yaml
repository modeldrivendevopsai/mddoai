project-key: CHATBOT_APP
key: CHATBOT_APP
name: chatbot-app

stages:
  - Default Stage:
      jobs:
        - build
        - unitTest
        - healthCheck
        - secretScan
        - push

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/framework-chatbot-image
  IMAGE_TAG: ${IMAGE_NAME}:${IMAGE_VERSION}-${CI_COMMIT_REF_SLUG}

build:
  key: BUILD
  tasks:
    - script:
        scripts:
          - docker build -t ${IMAGE_TAG} .

unitTest:
  key: UNITTEST
  requirements:
    - capability: os.linux
  tasks:
    - script:
        scripts:
          - python3 test/run_unit_tests.py

healthCheck:
  key: HEALTHCHECK
  requirements:
    - capability: os.linux
  tasks:
    - script:
        scripts:
          - ./scripts/health_check.sh

secretScan:
  key: SECRETSCAN
  tasks:
    - script:
        scripts:
          - gitleaks detect --source . --no-git -v

push:
  key: PUSH
  tasks:
    - script:
        scripts:
          - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - script:
        scripts:
          - docker push ${IMAGE_TAG}
