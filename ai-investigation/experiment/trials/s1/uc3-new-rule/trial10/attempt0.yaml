---
version: 2
plan:
  project-key: CHATBOT_APP
  key: CHATBOT_APP
  name: chatbot-app

variables:
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}/framework-chatbot-image"
  IMAGE_TAG: "${IMAGE_NAME}:${IMAGE_VERSION}-${CI_COMMIT_REF_SLUG}"

stages:
  - Default Stage:
      manual: false
      final: false
      jobs:
        - build
        - unitTest
        - healthCheck
        - secretScan
        - push

build:
  key: BUILD
  tasks:
    - script:
        interpreter: SHELL
        scripts:
          - docker build -t ${IMAGE_TAG} .

unitTest:
  key: UNITTEST
  requirements:
    - os.linux
  tasks:
    - script:
        interpreter: SHELL
        scripts:
          - python3 test/run_unit_tests.py

healthCheck:
  key: HEALTHCHECK
  requirements:
    - os.linux
  tasks:
    - script:
        interpreter: SHELL
        scripts:
          - ./scripts/health_check.sh

secretScan:
  key: SECRETSCAN
  requirements:
    - os.linux
  tasks:
    - script:
        interpreter: SHELL
        scripts:
          - gitleaks detect --source . --no-git -v

push:
  key: PUSH
  tasks:
    - script:
        interpreter: SHELL
        scripts:
          - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - script:
        interpreter: SHELL
        scripts:
          - docker push ${IMAGE_TAG}
