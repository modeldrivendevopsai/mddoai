version: 2
plan:
  project-key: CHATBOT_APP
  key: CHATBOT_APP
  name: chatbot-app

stages:
  - Default Stage:
      jobs:
        - build
        - unitTest
        - healthCheck
        - secretScan
        - push

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/framework-chatbot-image
  IMAGE_TAG: ${IMAGE_NAME}:${IMAGE_VERSION}-${CI_COMMIT_REF_SLUG}

build:
  key: BUILD
  tasks:
    - script: |
        docker build -t ${IMAGE_TAG} .

unitTest:
  key: UNITTEST
  requirements:
    - os.linux
  tasks:
    - script: |
        python3 test/run_unit_tests.py

healthCheck:
  key: HEALTHCHECK
  requirements:
    - os.linux
  tasks:
    - script: |
        ./scripts/health_check.sh

secretScan:
  key: SECRETSCAN
  tasks:
    - script: |
        gitleaks detect --source . --no-git -v

push:
  key: PUSH
  tasks:
    - script: |
        docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
        docker push ${IMAGE_TAG}
