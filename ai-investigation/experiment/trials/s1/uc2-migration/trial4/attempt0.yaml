---
version: 2
plan:
  project-key: CHATBOT_APP
  key: CHATBOT_APP
  name: chatbot-app

variables:
  IMAGE_NAME: ${bamboo.CI_REGISTRY_IMAGE}/framework-chatbot-image
  IMAGE_TAG: ${bamboo.IMAGE_NAME}:${bamboo.IMAGE_VERSION}-${bamboo.CI_COMMIT_REF_SLUG}

stages:
  - Default Stage:
      - build
      - unitTest
      - healthCheck
      - push

build:
  key: BUILD
  tasks:
    - script:
        - docker build -t ${bamboo.IMAGE_TAG} .

unitTest:
  key: UNITTEST
  tasks:
    - script:
        - python3 test/run_unit_tests.py
  requirements:
    - os.linux

healthCheck:
  key: HEALTHCHECK
  tasks:
    - script:
        - ./scripts/health_check.sh
  requirements:
    - os.linux

push:
  key: PUSH
  tasks:
    - script:
        - docker login -u ${bamboo.CI_REGISTRY_USER} -p ${bamboo.CI_JOB_TOKEN} ${bamboo.CI_REGISTRY}
    - script:
        - docker push ${bamboo.IMAGE_TAG}
