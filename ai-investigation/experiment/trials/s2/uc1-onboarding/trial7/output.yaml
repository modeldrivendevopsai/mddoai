stages:
  - build
  - test
  - health_check
  - push

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

default:
  image: docker:24.0
  services:
    - docker:24.0-dind

build:
  stage: build
  script:
    - docker build -t $IMAGE_TAG .
    - docker save $IMAGE_TAG -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

unit_test:
  stage: test
  script:
    - docker load -i image.tar
    - docker run --rm $IMAGE_TAG python test/run_unit_tests.py

health_check:
  stage: health_check
  script:
    - docker load -i image.tar
    - docker run -d --name chatbot_health_check $IMAGE_TAG
    - sleep 5
    - docker exec chatbot_health_check ./scripts/health_check.sh
    - docker stop chatbot_health_check
    - docker rm chatbot_health_check

push:
  stage: push
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
