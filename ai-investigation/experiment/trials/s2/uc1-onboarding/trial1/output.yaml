stages:
  - test
  - build
  - verify
  - publish

variables:
  IMAGE_NAME: "${CI_REGISTRY_IMAGE}/framework-chatbot-image"
  IMAGE_VERSION: "1.0.0"
  CANDIDATE_TAG: "candidate-${CI_PIPELINE_ID}"
  RELEASE_TAG: "${IMAGE_VERSION}-${CI_COMMIT_REF_SLUG}"
  HEALTH_CHECK_ALIAS: "chatbot-app"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "${DOCKER_TLS_CERTDIR}/client"

unit_tests:
  stage: test
  image: python:3.12-slim
  script:
    - python3 test/run_unit_tests.py

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "${CI_JOB_TOKEN}" | docker login "${CI_REGISTRY}" -u "${CI_REGISTRY_USER}" --password-stdin
  script:
    - docker build -t "${IMAGE_NAME}:${CANDIDATE_TAG}" .
    - docker push "${IMAGE_NAME}:${CANDIDATE_TAG}"

health_check:
  stage: verify
  image: curlimages/curl:latest
  services:
    - name: "${IMAGE_NAME}:${CANDIDATE_TAG}"
      alias: "${HEALTH_CHECK_ALIAS}"
  script:
    - sh ./scripts/health_check.sh

push_image:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "${CI_JOB_TOKEN}" | docker login "${CI_REGISTRY}" -u "${CI_REGISTRY_USER}" --password-stdin
  script:
    - docker pull "${IMAGE_NAME}:${CANDIDATE_TAG}"
    - docker tag "${IMAGE_NAME}:${CANDIDATE_TAG}" "${IMAGE_NAME}:${RELEASE_TAG}"
    - docker push "${IMAGE_NAME}:${RELEASE_TAG}"
