stages:
  - build
  - test
  - health_check
  - secret_scan
  - push

variables:
  IMAGE_NAME: chatbot-app

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA .

test:
  stage: test
  image: python:3.11
  needs:
    - build
  script:
    - python test/run_unit_tests.py

healthCheck:
  stage: health_check
  image: docker:24.0
  services:
    - docker:24.0-dind
  needs:
    - test
  script:
    - docker run -d --name health_check_container $IMAGE_NAME:$CI_COMMIT_SHA
    - ./scripts/health_check.sh
    - docker stop health_check_container
    - docker rm health_check_container

secretScan:
  stage: secret_scan
  image: zricethezav/gitleaks:latest
  needs:
    - healthCheck
  script:
    - gitleaks detect --source . --no-git -v

push:
  stage: push
  image: docker:24.0
  services:
    - docker:24.0-dind
  needs:
    - secretScan
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker tag $IMAGE_NAME:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHA
