image: docker:24.0

variables:
  IMAGE_NAME: chatbot-app
  IMAGE_TAG: $CI_COMMIT_SHA

stages:
  - build
  - test
  - health-check
  - secret-scan
  - push

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .

test:
  stage: test
  image: python:3.11
  needs:
    - build
  script:
    - python test/run_unit_tests.py

health_check:
  stage: health-check
  image: docker:24.0
  services:
    - docker:24.0-dind
  needs:
    - test
  script:
    - ./scripts/health_check.sh

secret_scan:
  stage: secret-scan
  image: zricethezav/gitleaks:latest
  needs:
    - health_check
  script:
    - gitleaks detect --source . --no-git -v --exit-code 1

push:
  stage: push
  image: docker:24.0
  services:
    - docker:24.0-dind
  needs:
    - secret_scan
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push $IMAGE_NAME:$IMAGE_TAG
