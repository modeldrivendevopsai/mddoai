version: 2
plan:
  project-key: CHATBOT
  key: CHATBOT
  name: chatbot-app

variables:
  IMAGE_NAME: framework-chatbot
  IMAGE_TAG: ${IMAGE_NAME}:${bamboo.buildNumber}

stages:
  - Default Stage:
      jobs:
        - build
        - unitTest
        - healthCheck
        - secretScan
        - push

build:
  key: BUILD
  tasks:
    - type: script
      scripts:
        - docker build -t ${IMAGE_TAG} .

unitTest:
  key: UNITTEST
  requirements:
    - os.linux
  tasks:
    - type: script
      scripts:
        - python3 test/run_unit_tests.py

healthCheck:
  key: HEALTHCHECK
  requirements:
    - os.linux
  tasks:
    - type: script
      scripts:
        - ./scripts/health_check.sh

secretScan:
  key: SECRETSCAN
  requirements:
    - os.linux
  tasks:
    - type: script
      scripts:
        - gitleaks detect --source . --no-git -v

push:
  key: PUSH
  requirements:
    - os.linux
  tasks:
    - type: script
      scripts:
        - docker login -u ${REGISTRY_USER} -p ${REGISTRY_PASSWORD} ${REGISTRY_HOST}
        - docker push ${IMAGE_TAG}
