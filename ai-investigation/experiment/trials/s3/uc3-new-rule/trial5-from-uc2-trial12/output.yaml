---
version: 2
plan:
  project-key: PROJ
  key: chatbot-app
  name: chatbot-app

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/framework-chatbot-image
  IMAGE_TAG: ${IMAGE_NAME}:${IMAGE_VERSION}-${CI_COMMIT_REF_SLUG}

stages:
  - Stage-build:
      jobs:
        - build
        - unitTest
  - Stage-healthCheck:
      jobs:
        - healthCheck
  - Stage-secretScan:
      jobs:
        - secretScan
  - Stage-push:
      jobs:
        - push

build:
  key: build
  clean-working-directory: false
  tasks:
  -
    script:
      body: docker build -t ${IMAGE_TAG} .

unitTest:
  key: unitTest
  clean-working-directory: false
  tasks:
  -
    script:
      body: python3 test/run_unit_tests.py
  docker:
    enabled: true
    image: python:3.12-slim

healthCheck:
  key: healthCheck
  clean-working-directory: false
  tasks:
  -
    script:
      body: ./scripts/health_check.sh
  docker:
    enabled: true
    image: curlimages/curl:latest

secretScan:
  key: secretScan
  clean-working-directory: false
  tasks:
  -
    script:
      body: gitleaks detect --source . --no-git -v

push:
  key: push
  clean-working-directory: false
  tasks:
  -
    script:
      body: docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
  -
    script:
      body: docker push ${IMAGE_TAG}

