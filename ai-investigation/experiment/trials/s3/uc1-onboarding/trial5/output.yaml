stages:
  - build
  - unitTest
  - healthCheck
  - push

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/framework-chatbot-image
  IMAGE_TAG: ${IMAGE_NAME}:${IMAGE_VERSION}-${CI_COMMIT_REF_SLUG}

default:
  image:
    name: docker:latest
  interruptible: false

build:
  stage: build
  script:
    - docker build -t ${IMAGE_TAG} .
  allow_failure: false
  interruptible: false
  retry:
    max: 1

unitTest:
  stage: unitTest
  image:
    name: python:3.12-slim
  script:
    - python3 test/run_unit_tests.py
  allow_failure: false
  interruptible: false
  retry:
    max: 1

healthCheck:
  stage: healthCheck
  image:
    name: curlimages/curl:latest
  script:
    - ./scripts/health_check.sh
  allow_failure: false
  interruptible: false
  needs:
    -
      job: build
      artifacts: false
      optional: false
  retry:
    max: 1

push:
  stage: push
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${IMAGE_TAG}
  allow_failure: false
  interruptible: false
  needs:
    -
      job: healthCheck
      artifacts: false
      optional: false
  retry:
    max: 1

