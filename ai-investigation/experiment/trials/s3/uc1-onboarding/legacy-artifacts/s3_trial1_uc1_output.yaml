
variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/framework-chatbot-image
  IMAGE_TAG: ${IMAGE_NAME}:${IMAGE_VERSION}-${CI_COMMIT_REF_SLUG}

stages:
  - stage_healthCheck
  - stage_build
  - stage_unitTest
  - stage_push

default:
image:
  name: ubuntu:latest








  interruptible: false



jobs:
  build:
    stage: stage_build
  script:
    - docker build -t ${IMAGE_TAG} .
  
  
  
  
  
  
  
  
  allow_failure: false
  interruptible: false
  
  
  
  
  
  
  
  
  
  unitTest:
    stage: stage_unitTest
  script:
    - python3 test/run_unit_tests.py
  
  
  
  
  
  
  
  image:
    name: ubuntu:latest
  
  
  
  allow_failure: false
  interruptible: false
  
  
  
  
  
  
  
  
  
  healthCheck:
    stage: stage_healthCheck
  script:
    - ./scripts/health_check.sh
  
  
  
  
  
  
  
  image:
    name: ubuntu:latest
  
  
  
  allow_failure: false
  interruptible: false
  
  
  needs:
    - job: build
      artifacts: false
      optional: false
    
  
  
  
  
  
  
  
  push:
    stage: stage_push
  script:
    - docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}
    - docker push ${IMAGE_TAG}
  
  
  
  
  
  
  
  
  allow_failure: false
  interruptible: false
  
  
  needs:
    - job: healthCheck
      artifacts: false
      optional: false
    
  
  
  
  
  
  
  
