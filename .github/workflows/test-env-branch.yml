name: Test environment branch

# Chooses the branch the Test environment on the dev VM runs. It writes the
# name to the file `branch` on the `test-env-config` branch, and the VM reads
# it from there at its next check. Only people with write access to the
# repository can run a workflow by hand.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run in the Test environment"
        required: true
        type: string

permissions:
  contents: write

# One run at a time, so two choices cannot race.
concurrency:
  group: test-env-branch
  cancel-in-progress: false

jobs:
  choose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Through the environment, never pasted into the script, so a branch
      # name cannot inject commands.
      BRANCH: ${{ inputs.branch }}
      REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: Record the branch
        run: |
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || ! git ls-remote --exit-code --heads "$REPO" "refs/heads/$BRANCH" >/dev/null; then
            echo "::error::'$BRANCH' is not a branch name, or there is no such branch."
            exit 1
          fi
          # The default shell has no pipefail, so grep alone decides here.
          if ! curl -fsS "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/refs/heads/$BRANCH/ai/docker-compose.yml" | grep -q UI_PORT; then
            echo "::error::Could not read '$BRANCH', or it does not have the configurable stack ports, so it cannot run in the Test environment."
            exit 1
          fi

          # The first run ever creates the config branch.
          git clone --quiet --depth 1 --branch test-env-config "$REPO" config || git init --quiet --initial-branch test-env-config config
          cd config
          echo "$BRANCH" >branch
          git add branch
          git -c user.name="$GITHUB_ACTOR" -c user.email="$GITHUB_ACTOR@users.noreply.github.com" \
            commit --quiet -m "Test environment runs $BRANCH" || { echo "'$BRANCH' is already chosen."; exit 0; }
          git push --quiet "$REPO" test-env-config
          echo "The Test environment switches to \`$BRANCH\` within minutes." >>"$GITHUB_STEP_SUMMARY"
